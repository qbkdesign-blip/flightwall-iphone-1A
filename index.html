<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FLIGHTWALL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #050505;
  color: #eee;
  font-family: "Arial Narrow", Arial, sans-serif;
  overflow-x: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #d9ad32;
  padding-bottom: 13px;
  margin-bottom: 12px;
}

h1 {
  color: #e5bd32;
  font-size: clamp(26px, 4vw, 44px);
  letter-spacing: 6px;
  margin: 0;
  font-weight: 900;
}

#clock {
  color: #e5bd32;
  font-size: clamp(20px, 3vw, 30px);
  font-weight: bold;
  font-family: monospace;
}

.info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #888;
  font-size: 11px;
  letter-spacing: 1.5px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

#status {
  color: #69c77b;
}

#count {
  color: #e5bd32;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th {
  color: #e5bd32;
  text-align: left;
  font-size: clamp(9px, 1.5vw, 13px);
  padding: 12px 6px;
  border-bottom: 1px solid #8a702d;
  letter-spacing: 1.2px;
  background: #151515;
}

td {
  padding: 13px 6px;
  border-bottom: 1px solid #252525;
  font-size: clamp(10px, 1.7vw, 16px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: "Arial Narrow", Arial, sans-serif;
}

tr:nth-child(even) {
  background: #111;
}

.flight {
  color: #e5bd32;
  font-weight: bold;
}

.muted {
  color: #888;
}

#empty {
  text-align: center;
  color: #888;
  padding: 35px 10px;
  display: none;
}

button {
  background: #d9ad32;
  color: #080808;
  border: none;
  padding: 10px 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
  letter-spacing: 1px;
}

footer {
  margin-top: 20px;
  border-top: 1px solid #444;
  padding-top: 10px;
  color: #666;
  font-size: 10px;
  display: flex;
  justify-content: space-between;
  letter-spacing: 1px;
}

@media (orientation: landscape) and (max-height: 500px) {
  body {
    padding: 10px 18px;
  }

  header {
    margin-bottom: 8px;
    padding-bottom: 7px;
  }

  td {
    padding: 9px 5px;
  }

  th {
    padding: 7px 5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>FLIGHTWALL</h1>
  <div id="clock">--:--:--</div>
</header>

<div class="info">
  <span id="status">GPS wird gesucht ...</span>
  <span id="count">0 AIRCRAFT</span>
  <span>LIVE RADAR DATA</span>
</div>

<table>
  <thead>
    <tr>
  <th>FLIGHT</th>
  <th>AIRCRAFT TYPE</th>
  <th>ALTITUDE</th>
  <th>SPEED</th>
  <th>HEADING</th>
  <th>DISTANCE</th>
</tr>
  </thead>
  <tbody id="flights"></tbody>
</table>

<div id="empty">Aktuell keine Flugzeuge im gewählten Umkreis gefunden.</div>

<button id="locate">GPS-STANDORT AKTUALISIEREN</button>

<footer>
  <span>DATA: ADSB.LOL</span>
  <span>UPDATE: 15 SEC</span>
  <span>FLIGHTWALL V1.0</span>
</footer>

<script>
const RADIUS_NM = 50;
const REFRESH_MS = 15000;

let userLat = null;
let userLon = null;
let refreshTimer = null;
let loading = false;

const statusEl = document.getElementById("status");
const flightsEl = document.getElementById("flights");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");

function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("de-AT");
}

setInterval(updateClock, 1000);
updateClock();

function distanceNM(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;

  return 3440.065 * 2 *
    Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function headingText(degrees) {
  if (typeof degrees !== "number") return "--";

  const directions = [
    "N", "NNO", "NO", "ONO",
    "O", "OSO", "SO", "SSO",
    "S", "SSW", "SW", "WSW",
    "W", "WNW", "NW", "NNW"
  ];

  return Math.round(degrees) + "° " +
    directions[Math.round(degrees / 22.5) % 16];
}

function altitudeText(value) {
  if (value === "ground") return "BODEN";
  if (typeof value !== "number") return "--";

  const meters = Math.round(value * 0.3048);
  return meters.toLocaleString("de-AT") + " m";
}

function speedText(value) {
  if (typeof value !== "number") return "--";

  const kmh = Math.round(value * 1.852);
  return kmh.toLocaleString("de-AT") + " km/h";
}

function headingText(degrees) {
  if (typeof degrees !== "number") return "--";

  const directions = [
    "N", "NNO", "NO", "ONO",
    "O", "OSO", "SO", "SSO",
    "S", "SSW", "SW", "WSW",
    "W", "WNW", "NW", "NNW"
  ];

  return Math.round(degrees) + "° " +
    directions[Math.round(degrees / 22.5) % 16];
}

function aircraftName(code) {
  const types = {
    "A318": "Airbus A318",
    "A319": "Airbus A319",
    "A320": "Airbus A320",
    "A20N": "Airbus A320neo",
    "A321": "Airbus A321",
    "A21N": "Airbus A321neo",
    "A332": "Airbus A330-200",
    "A333": "Airbus A330-300",
    "A359": "Airbus A350-900",
    "A35K": "Airbus A350-1000",
    "A388": "Airbus A380",
    "B738": "Boeing 737-800",
    "B38M": "Boeing 737 MAX 8",
    "B739": "Boeing 737-900",
    "B744": "Boeing 747-400",
    "B748": "Boeing 747-8",
    "B763": "Boeing 767-300",
    "B772": "Boeing 777-200",
    "B77W": "Boeing 777-300ER",
    "B788": "Boeing 787-8",
    "B789": "Boeing 787-9",
    "E190": "Embraer E190",
    "E195": "Embraer E195",
    "E290": "Embraer E190-E2",
    "E295": "Embraer E195-E2",
    "CRJ9": "Bombardier CRJ-900",
    "DH8D": "Dash 8 Q400",
    "AT76": "ATR 72-600"
  };

  if (!code) return "UNBEKANNT";

  return types[code] || code;
}
function addCell(row, text, className) {
  const cell = document.createElement("td");
  cell.textContent = text;
  if (className) cell.className = className;
  row.appendChild(cell);
}

async function loadFlights() {
  if (loading || userLat === null || userLon === null) return;

  loading = true;
  statusEl.textContent = "DATEN WERDEN GELADEN ...";

  try {
    const url =
  `https://bitter-fog-12bdflightwall-proxy.qbk-design.workers.dev/flights?lat=${userLat}&lon=${userLon}&dist=${RADIUS_NM}`;

    const response = await fetch(url);

if (!response.ok) {
  throw new Error("HTTP " + response.status);
}

    if (!response.ok) {
      throw new Error("Flugdaten nicht erreichbar");
    }

    const data = await response.json();
    const aircraft = Array.isArray(data.ac) ? data.ac : [];

    const nearby = aircraft
      .filter(a =>
        typeof a.lat === "number" &&
        typeof a.lon === "number"
      )
      .map(a => ({
        ...a,
        distance: distanceNM(userLat, userLon, a.lat, a.lon)
      }))
      .filter(a => a.distance <= RADIUS_NM)
      .sort((a, b) => a.distance - b.distance);

    flightsEl.replaceChildren();

    nearby.forEach(plane => {
      const row = document.createElement("tr");

      const flight = (plane.flight || "").trim() || "UNKNOWN";
      const aircraftType = aircraftName(plane.t);

      addCell(row, flight, "flight");
      addCell(row, aircraftType);
      addCell(row, altitudeText(plane.alt_baro));
      addCell(row, speedText(plane.gs));
      addCell(row, headingText(plane.track));
      addCell(row, (plane.distance * 1.852).toFixed(1) + " km");

      flightsEl.appendChild(row);
    });

    countEl.textContent = nearby.length + " AIRCRAFT";
    emptyEl.style.display = nearby.length ? "none" : "block";
    statusEl.textContent = "LIVE • GPS AKTIV";

  } catch (error) {
    statusEl.textContent = "FEHLER: " + error.message;
    console.error(error);
  } finally {
    loading = false;
  }
}

function startGPS() {
  if (!navigator.geolocation) {
    statusEl.textContent = "GPS NICHT VERFÜGBAR";
    return;
  }

  statusEl.textContent = "GPS-STANDORT WIRD ERMITTELT ...";

  navigator.geolocation.getCurrentPosition(
    position => {
      userLat = position.coords.latitude;
      userLon = position.coords.longitude;

      statusEl.textContent = "GPS AKTIV";

      loadFlights();

      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(loadFlights, REFRESH_MS);
    },
    error => {
      statusEl.textContent =
        "GPS NICHT FREIGEGEBEN – BITTE STANDORT ERLAUBEN";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 30000
    }
  );
}

document.getElementById("locate").addEventListener("click", startGPS);

startGPS();
</script>

</body>
</html>
